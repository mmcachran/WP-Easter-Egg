name: Tweet on Release

on:
  release:
    types: [ published ]

jobs:
  tweet:
    name: Tweet new release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get release version
        id: get_version
        run: echo "version=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT

      - name: Get release notes
        id: get_notes
        run: |
          NOTES="${{ github.event.release.body }}"
          NOTES="${NOTES//'%'/'%25'}"
          NOTES="${NOTES//$'\n'/'%0A'}"
          NOTES="${NOTES//$'\r'/'%0D'}"
          echo "notes=${NOTES}" >> $GITHUB_OUTPUT

      - name: Tweet release
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          NOTES="${{ steps.get_notes.outputs.notes }}"
          TWEET="🚀 WP Easter Egg $VERSION is out! $NOTES #WordPress #EasterEgg #WPPlugin"
          TWEET_ENCODED=$(echo -n "$TWEET" | jq -Rs .)
          curl -X POST "https://api.twitter.com/2/tweets" \
            -H "Authorization: OAuth oauth_consumer_key=\"$TWITTER_API_KEY\", oauth_token=\"$TWITTER_ACCESS_TOKEN\", oauth_signature_method=\"HMAC-SHA1\", oauth_timestamp=\"$(date +%s)\", oauth_nonce=\"$(openssl rand -hex 16)\", oauth_version=\"1.0\"" \
            -H "Content-Type: application/json" \
            -d "{\"text\": $TWEET_ENCODED}" \
            --fail-with-body || echo "Tweet failed (check Twitter API credentials)"
